<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIIVA - Full Screen Real Try-On</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;overflow-x:hidden}
.top{position:sticky;top:0;z-index:50;background:#fff;color:#000;display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.logo{font-weight:900;color:#ff007f;font-size:22px}
.earn{background:#000;color:#0f0;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:800}
.detect{background:#222;color:#fff;padding:6px 12px;border-radius:20px;font-size:11px}
.cat-bar{background:#111;padding:10px;display:flex;gap:8px;overflow-x:auto;position:sticky;top:48px;z-index:40}
.cat-bar button{white-space:nowrap;border:1px solid #ff007f;background:#000;color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer}
#dropdownBtn{background:#ff007f!important}
#dropdownMenu{display:none;position:fixed;top:95px;left:10px;background:#fff;color:#000;border-radius:14px;width:220px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#dropdownMenu div{padding:14px 16px;border-bottom:1px solid #eee;font-weight:700;cursor:pointer}
#dropdownMenu div:active{background:#ff007f;color:#fff}

/* MIRROR - SMALL */
.mirror-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 10px}
.mirror{width:200px;height:200px;border-radius:50%;border:5px solid #ff007f;overflow:hidden;background:#111;position:relative;box-shadow:0 0 25px #ff007f88;cursor:pointer}
.mirror video{width:100%;height:100%;object-fit:cover;display:none}

/* FULLSCREEN MODE */
#fullScreenMirror{display:none;position:fixed;inset:0;z-index:9999;background:#000}
#fullScreenMirror.active{display:block}
#fullVideo{width:100%;height:100%;object-fit:cover}
#dressOverlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;max-width:380px;pointer-events:none;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
#closeFull{position:absolute;top:15px;right:15px;background:rgba(0,0,0,.7);color:#fff;border:2px solid #fff;width:45px;height:45px;border-radius:50%;font-size:20px;z-index:10000}
#fullTopInfo{position:absolute;top:15px;left:15px;background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;z-index:10000}

.dress-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.dress-card{background:#1a1a1a;border-radius:14px;overflow:hidden;border:1px solid #333}
.dress-card img{width:100%;height:220px;object-fit:cover}
.dress-info{padding:8px}
.dress-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dress-price{color:#ff007f;font-weight:900;font-size:13px;margin:3px 0}
.try-btn{background:#ff007f;color:#fff;border:none;width:100%;padding:9px;border-radius:20px;font-weight:800;cursor:pointer;margin-top:4px}
.try-btn:active{transform:scale(.95)}
</style>
</head>
<body>

<div class="top">
<div style="display:flex;gap:8px;align-items:center"><span class="logo">VIIVA</span><span class="earn" id="earnText">💰 0 GHC EARNED</span></div>
<span class="detect" id="detectText">Tap Mirror to Start</span>
</div>

<div class="cat-bar">
<button id="dropdownBtn" onclick="toggleDropdown()">☰ Occasions ▼</button>
<div id="dropdownMenu">
<div onclick="loadOccasion('Wedding')">💒 Wedding Gowns</div>
<div onclick="loadOccasion('Funeral')">⚫ Funeral - Black</div>
<div onclick="loadOccasion('Church')">⛪ Church - Modest</div>
<div onclick="loadOccasion('Office')">🏢 Office - Corporate</div>
<div onclick="loadOccasion('Beach')">🏖️ Beach - Light</div>
<div onclick="loadOccasion('Engagement')">💍 Engagement</div>
</div>
<button onclick="loadOccasion('Funeral')">Funeral</button>
<button onclick="loadOccasion('Church')">Church</button>
<button onclick="loadOccasion('Office')">Office</button>
<button onclick="loadOccasion('Wedding')">Wedding</button>
</div>

<div class="mirror-wrap">
<div class="mirror" id="mirrorCircle" onclick="startMirror()">
<video id="smallVideo" autoplay playsinline muted></video>
<div id="tap" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.45);font-weight:900;text-align:center">TAP FOR<br>FULLSCREEN<br>MIRROR<br>👗</div>
</div>
<div style="margin-top:12px;font-weight:800;color:#ff007f">Real Full-Screen Try-On</div>
<div style="font-size:12px;opacity:.7;margin-top:4px">Tap mirror, then tap dress below</div>
</div>

<div id="dressGrid" class="dress-grid"></div>

<!-- FULLSCREEN MIRROR -->
<div id="fullScreenMirror">
<button id="closeFull" onclick="closeFull()">✕</button>
<div id="fullTopInfo">👗 <span id="currentDressName">Select Dress Below</span></div>
<video id="fullVideo" autoplay playsinline muted></video>
<img id="dressOverlay" src="">
<div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:15px;display:flex;gap:8px;overflow-x:auto" id="fullDressStrip"></div>
</div>

<script>
let currentOccasion='Wedding';
let dresses={
'Wedding':[

],

{name:'All Black Modest Funeral',price:'120 GHC',img:'https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=500'},

{name:'Elegant Black Funeral Gown',price:'195 GHC',img:'https://images.unsplash.com/photo-1554412933-514a83d2f3c0?w=500'}
],
'Church':[
{name:'Pink Church Modest Dress',price:'130 GHC',img:'https://images.unsplash.com/photo-1495385794356-15371f348c31?w=500'},
{name:'Blue Kaba Church Wear',price:'110 GHC',img:'https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?w=500'},
{name:'White Lace Church Dress',price:'140 GHC',img:'https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=500'},

'Engagement':[

{name:'Lace Engagement Dress',price:'280 GHC',img:'https://images.unsplash.com/photo-1520854221256-17451cc331bf?w=500'},
{name:'Green Engagement Gown',price:'300 GHC',img:'https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=500'},
{name:'Pink Engagement Ball Dress',price:'310 GHC',img:'https://images.unsplash.com/photo-1594552072238-b8a33785b261?w=500'}
]
};

function toggleDropdown(){let m=document.getElementById('dropdownMenu');m.style.display=m.style.display==='block'?'none':'block';}
document.addEventListener('click',e=>{if(!e.target.closest('#dropdownBtn')&&!e.target.closest('#dropdownMenu'))document.getElementById('dropdownMenu').style.display='none';});

function loadOccasion(o){
currentOccasion=o;
document.getElementById('dropdownMenu').style.display='none';
document.getElementById('dropdownBtn').textContent='☰ '+o+' ▼';
let grid=document.getElementById('dressGrid');
let strip=document.getElementById('fullDressStrip');
grid.innerHTML=''; strip.innerHTML='';
let list=dresses[o]||dresses['Wedding'];
list.forEach((d,i)=>{
let card=document.createElement('div');
card.className='dress-card';
card.innerHTML=`<img src="${d.img}" loading="lazy"><div class="dress-info"><div class="dress-name">${d.name}</div><div class="dress-price">${d.price}</div><button class="try-btn" onclick="tryOn('${o}',${i})">TRY ON FULL</button></div>`;
grid.appendChild(card);
let mini=document.createElement('div');
mini.style.cssText='min-width:70px;cursor:pointer;text-align:center';
mini.innerHTML=`<img src="${d.img}" style="width:60px;height:60px;border-radius:10px;object-fit:cover;border:2px solid #ff007f"><div style="font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:60px">${d.name.split(' ')[0]}</div>`;
mini.onclick=()=>tryOn(o,i);
strip.appendChild(mini);
});
}

async function startMirror(){
let smallV=document.getElementById('smallVideo');
let fullV=document.getElementById('fullVideo');
try{
let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
smallV.srcObject=stream; smallV.style.display='block';
fullV.srcObject=stream;
document.getElementById('tap').style.display='none';
document.getElementById('detectText').textContent='✓ Camera Ready - Full Screen Open';
await fullV.play(); await smallV.play();
openFull();
}catch(e){alert('Allow camera! Use Chrome and allow permission. Error:'+e.message);}
}

function openFull(){document.getElementById('fullScreenMirror').classList.add('active');}
function closeFull(){document.getElementById('fullScreenMirror').classList.remove('active');}

function tryOn(occ,index){
let d=dresses[occ][index];
document.getElementById('dressOverlay').src=d.img;
document.getElementById('dressOverlay').style.display='block';
document.getElementById('currentDressName').textContent=d.name+' - '+d.price;
openFull();
startMirror();
let earnEl=document.getElementById('earnText');
let curr=parseInt(earnEl.textContent.replace(/\D/g,''))||0;
earnEl.textContent='💰 '+(curr+2)+' GHC EARNED';
}

loadOccasion('Wedding');
</script>
</body>
</html>
