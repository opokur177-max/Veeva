<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIIVA - Real Try-On</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff}
.top{position:sticky;top:0;z-index:99;background:#fff;color:#000;display:flex;justify-content:space-between;padding:8px 12px;align-items:center}
.logo{font-weight:900;color:#ff007f;font-size:22px}
.earn{background:#000;color:#0f0;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:700}
.detect{font-size:10px;background:#222;color:#fff;padding:5px 10px;border-radius:15px}
.cat-bar{background:#111;padding:8px;display:flex;gap:8px;overflow-x:auto}
#dropdownBtn{background:#ff007f;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:800}
#dropdownMenu{display:none;position:absolute;top:85px;left:8px;background:#fff;color:#000;border-radius:12px;width:200px;z-index:100}
#dropdownMenu div{padding:12px 15px;border-bottom:1px solid #eee;font-weight:600;cursor:pointer}
.mirror-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 10px}
.mirror{width:210px;height:210px;border-radius:50%;border:6px solid #ff007f;overflow:hidden;background:#111;position:relative;box-shadow:0 0 30px #ff007f}
.mirror video{width:100%;height:100%;object-fit:cover;display:none}
.btn-pink{background:#ff007f;color:#fff;border:none;padding:12px;border-radius:25px;font-weight:800;width:90%;margin:10px}
.dress-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.dress-card{background:#222;border-radius:12px;overflow:hidden}
.dress-card img{width:100%;height:170px;object-fit:cover}
</style></head><body>
<div class="top"><div style="display:flex;gap:8px;align-items:center"><span class="logo">VIIVA</span><span class="earn" id="earnText">💰 0 GHC YOU EARN</span></div><span class="detect" id="detectText">Detecting...</span></div>
<div class="cat-bar"><button id="dropdownBtn" onclick="toggleDropdown()">☰ Occasions ▼</button>
<div id="dropdownMenu"><div onclick="loadOccasion('Wedding')">💒 Wedding (70+)</div><div onclick="loadOccasion('Funeral')">⚫ Funeral (70+)</div><div onclick="loadOccasion('Church')">⛪ Church</div><div onclick="loadOccasion('Office')">🏢 Office</div><div onclick="loadOccasion('Beach')">🏖️ Beach</div><div onclick="loadOccasion('Makeup')">💄 Makeup</div></div>
<button style="border:1px solid #ff007f;background:#000;color:#fff;padding:6px 14px;border-radius:20px" onclick="loadOccasion('Funeral')">Funeral</button>
<button style="border:1px solid #ff007f;background:#000;color:#fff;padding:6px 14px;border-radius:20px" onclick="loadOccasion('Church')">Church</button>
<button style="border:1px solid #ff007f;background:#000;color:#fff;padding:6px 14px;border-radius:20px" onclick="loadOccasion('Office')">Office</button></div>
<div class="mirror-wrap"><div class="mirror" id="mirrorCircle" onclick="startMirror()"><video id="video" autoplay playsinline muted></video><div id="tap" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);font-weight:800">TAP MIRROR</div></div><div style="margin-top:10px;font-weight:800">Tap Mirror - 100% Real Try-On</div></div>
<button class="btn-pink" onclick="loadOccasion(currentOccasion)">👗 70+ Online Dresses - Tap occasion to load</button>
<div id="dressGrid" class="dress-grid"></div>
<script>
let currentOccasion='Wedding';
function toggleDropdown(){let m=document.getElementById('dropdownMenu');m.style.display=m.style.display==='block'?'none':'block';}
function loadOccasion(o){currentOccasion=o;document.getElementById('dropdownMenu').style.display='none';document.getElementById('dropdownBtn').textContent='☰ '+o+' ▼';let g=document.getElementById('dressGrid');g.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('div');d.className='dress-card';d.innerHTML=`<img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"><div style="padding:6px;font-size:11px"><b>${o} Dress ${i+1}</b><br>45 GHC<br><button onclick="tryOn()" style="background:#ff007f;color:#fff;border:none;padding:4px 10px;border-radius:12px;width:100%;margin-top:4px">TRY ON</button></div>`;g.appendChild(d);}}
async function startMirror(){let v=document.getElementById('video');try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});v.srcObject=s;v.style.display='block';document.getElementById('tap').style.display='none';await v.play();document.getElementById('detectText').textContent='Woman Detected ✓';}catch(e){alert('Allow camera: open in Chrome, error:'+e.message);}}
function tryOn(){let e=document.getElementById('earnText');let c=parseInt(e.textContent)||0;e.textContent='💰 '+(c+2)+' GHC YOU EARN';startMirror();window.scrollTo({top:0,behavior:'smooth'});}
loadOccasion('Wedding');
</script></body></html>
